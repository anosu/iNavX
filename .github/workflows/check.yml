name: Checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
      - run: bun install --frozen-lockfile
      - name: Install ShellCheck 0.11.0
        run: |
          curl -fsSL --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - run: bunx playwright install --with-deps chromium
      - run: bun run check:full
      - run: go test -race ./backend
      - run: docker build -t inavx:check .
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: Join-Path $env:MSYS2_ROOT "mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: bun install --frozen-lockfile
      - run: bun run build:server
      - run: bun run test:server
      - run: bun run test:ui
      - shell: pwsh
        run: |
          $env:DATA_DIR = Join-Path $env:RUNNER_TEMP "inav-data"
          $env:BACKUP_DIR = Join-Path $env:RUNNER_TEMP "inav-backups"
          bun run dev:server migrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run start migrate
